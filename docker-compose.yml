services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: brain_mri_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-brain_mri_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Celery Message Broker
  redis:
    image: redis:7-alpine
    container_name: brain_mri_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. FastAPI Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brain_mri_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/brain_mri_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - MODEL_PATH=./models/brain_mri_resnet50_v1.pt
      - MODEL_DEVICE=cpu
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_DIR=./uploads
    volumes:
      - .:/app
      - uploads_data:/app/uploads
      - models_data:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Celery Worker (Async AI Processing)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brain_mri_celery_worker
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info -c 2
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/brain_mri_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - MODEL_PATH=./models/brain_mri_resnet50_v1.pt
      - MODEL_DEVICE=cpu
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_DIR=./uploads
    volumes:
      - .:/app
      - uploads_data:/app/uploads
      - models_data:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  models_data:
